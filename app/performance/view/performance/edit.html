{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}
<form class="layui-form p-page">
	<h3 class="pb-3">编辑绩效单</h3>
	<table class="layui-table layui-table-form">
		<tr>
			<td class="layui-td-gray">绩效周期<font>*</font></td>
			<td><input type="text" class="layui-input" placeholder="请选择" lay-verify="required" lay-reqText="请完善事件周期" readonly name="range_time" id="range_time" value="{$detail.range_time|default=''}" data-range="~"></td>
			<td class="layui-td-gray-2">绩效单标题<font>*</font></td>
			<td><input type="text" name="title" placeholder="例：20XX年X月的绩效单" lay-verify="required" lay-reqText="请完善绩效单标题" class="layui-input" value="{$detail.title|default=''}"></td>
		</tr>
	</table>
	<div class="pt-4">
		<input type="hidden" name="id" value="{$detail.id|default=0}"/>
		<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">立即提交</button>
		<button type="reset" class="layui-btn layui-btn-primary">重置</button>
	</div>
</form>
{/block}
<!-- /主体 -->
<!-- 脚本 -->
{block name="script"}
<script>
	const performance_id = {$detail.id};
	var moduleInit = ['tool','laydatePlus'];

	function gouguInit() {
		var form = layui.form, tool = layui.tool, laydatePlus = layui.laydatePlus;
		var laydatePlus = new laydatePlus({'target':'range_time'});
		//监听提交
		form.on('submit(webform)', function (data) {
			let callback = function (e) {
				layer.msg(e.msg);
				if (e.code == 0) {
					tool.sideClose(1000);
				}
			}
			tool.post("/performance/performance/add", data.field, callback);
			return false;
		});
		
	}
</script>
{/block}
<!-- /脚本 -->
