{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}

<div class="p-page">
	<table class="layui-hide" id="table_performance" lay-filter="table_performance"></table>
</div>

<script type="text/html" id="toolbarDemo">
  <div class="layui-btn-group">
  	<button class="layui-btn layui-btn-sm tool-add" type="button" data-href="/performance/performance/add">创建绩效单</button>
  </div>
</script>

{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	const moduleInit = ['tool','tablePlus'];
	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool;
		
		layui.pageTable = table.render({
			elem: "#table_performance"
			,title: '绩效单列表'
			,toolbar: "#toolbarDemo"
			,url: "/performance/performance/datalist"
			,page: true
			,limit: 20
			,cellMinWidth: 80
			,height: 'full-56'
			,cols: [[
				{field:'id',width:80, title: 'ID号', align:'center'}
				,{field:'status_name',title: '当前状态',width:136, align:'center',templet: function (d) {
					var html = '<span class="check-status-color-' + d.status + '">『' + d.status_name + '』</span>';
					return html;
				}}
				,{field:'range_time',title: '绩效周期',width:180, align:'center'}
				,{field:'title',title: '绩效单名称'}
				,{field:'title',title: '绩效审核情况',width:180, align:'center',templet: function(d){
					if(d.status>0){
						return '<span class="green">已审核('+d.count_a+')</span><span class="red ml-3">未审核('+d.count_b+')</span>';
					}
					else{
						return '-';
					}
				}}
				,{field:'admin_name',title: '创建人',width:90,align:'center'}
				,{field:'create_time', title: '创建时间',width:150,align:'center'}
				,{width:120,fixed:'right',title: '操作', align:'center',ignoreExport:true,templet: function(d){
					var html='';
					var btn1='<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="view">详细</a>';
					var btn2='<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>';
					var btn3='<a class="layui-btn layui-btn-xs" lay-event="send">发布</a>';
					var btn4='<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="back">撤回</a>';
					var btn5='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
					html = '<div class="layui-btn-group">'+btn1+'</div>';
					if(d.status==0){
						html = '<div class="layui-btn-group">'+btn1+btn2+btn5+'</div>';
					}
					if(d.status==1){
						html = '<div class="layui-btn-group">'+btn1+btn5+'</div>';
					}
					if(d.status==2){
						html = '<div class="layui-btn-group">'+btn1+btn3+btn4+'</div>';
					}
					if(d.status==3){
						html = '<div class="layui-btn-group">'+btn1+btn4+'</div>';
					}
					return html;
				}}
			]]
		});
			
		table.on('tool(table_performance)',function (obj) {
			var checkStatus = table.checkStatus(obj.config.id); //获取选中行状态
			var data = obj.data;
			if (obj.event === 'view') {
				tool.side("/performance/performance/view?id="+data.id);
				return;
			}
			if (obj.event === 'edit') {
				tool.side("/performance/performance/add?id="+data.id);
				return;
			}
			if (obj.event === 'check') {
				tool.ask('确定已复核过该绩效数据吗?',function(){
					let callback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							layui.pageTable.reload();
						}
					}
					tool.post("/performance/api/performance_check", {performance_id:data.id}, callback);
				})
			}
			
			if (obj.event === 'send') {
				tool.ask('确定发布该绩效确认单吗?',function(){
					let callback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							tool.reload(1000);
						}
					}
					tool.post("/performance/api/performance_send", {performance_id:data.id}, callback);	
				})
			}
			if (obj.event === 'back') {
				tool.ask('撤回以后已确认绩效信息也会被撤回，确定要撤回吗?',function(){
					let callback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							tool.reload(1000);
						}
					}
					tool.post("/performance/api/performance_back", {performance_id:data.id}, callback);	
				})
			}
			if (obj.event === 'del') {
				layer.confirm('确定要删除该内容吗?', { icon: 3, title: '提示' }, function (index) {
					let callback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							obj.del();
						}
					}
					tool.delete("/performance/performance/del", { id: data.id }, callback);
					layer.close(index);
				});
				return;
			}
		});
	}
</script>
{/block}
<!-- /脚本 -->
