{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}
<div class="p-page">
	<h3 class="pb-3">绩效规则详情</h3>
	<table class="layui-table layui-table-form">
		<tr>
			<td class="layui-td-gray">规则名称</td>
			<td>{$detail.title|default=''}</td>
			<td class="layui-td-gray">绩效分数</td>
			<td>{$detail.score|default='0'}</td>
		</tr>
		<tr>
			<td class="layui-td-gray-2">关联绩效模板</td>
			<td colspan="3">{$detail.templates|default='-'}</td>
		</tr>
		<tr>
			<td class="layui-td-gray">规则描述</td>
			<td colspan="3">{$detail.content|default=''}</td>
		</tr>
	</table>
</div>
{/block}
<!-- /主体 -->
<!-- 脚本 -->
{block name="script"}
<script>
	var moduleInit = ['tool'];

	function gouguInit() {
		var tool = layui.tool;
		
	}
</script>
{/block}
