{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}
<form class="layui-form p-page">
	<h3 class="pb-2">新增销项发票申请</h3>
	<table class="layui-table layui-table-form">
		<tr>
			<td colspan="4"><strong>销售方(开票主体)</strong></td>
		</tr>
		<tr>
			<td class="layui-td-gray-2">开票主体</td>
			<td>
				<input type="text" class="layui-input subject-picker" name="subject_name" placeholder="请选择开票主体" readonly value="" lay-verify="required" lay-reqText="请完善开票主体">		
				<input type="hidden" class="layui-input" name="invoice_subject" value="0">		
			</td>
			<td class="layui-td-gray-2">纳税人识别号</td>
			<td class="subject_tax_num">-</td>
		</tr>
		<tr>
			<td colspan="2"><strong>购买方(开票抬头)</strong></td>
			<td class="layui-td-gray">抬头类型<font>*</font></td>
			<td>
				<input type="radio" name="types" lay-filter="type" value="1" title="企业" checked>
				<input type="radio" name="types" lay-filter="type" value="2" title="个人">
			</td>
		</tr>		
		<tr>
			<td class="layui-td-gray">开票抬头<font>*</font></td>
			<td>
				<div class="layui-input-group" style="width:100%">
					<input type="text" name="invoice_title" value="" placeholder="请输入，若是个人输入姓名" class="layui-input" lay-verify="required" lay-reqText="请输入开票抬头">
					<input type="hidden" name="customer_id" value=0>
					<div class="layui-input-split layui-input-suffix invoice-qiye customer-picker" style="cursor: pointer;"><i class="layui-icon layui-icon-search"></i>客户</div>
				</div>
			</td>
			<td class="layui-td-gray-2">纳税人识别号<font>*</font></td>
			<td><input type="text" name="invoice_tax" class="layui-input" value=""  placeholder="输入纳税人识别号，若是个人输入身份证号" lay-verify="required"  lay-reqText="请输入纳税人识别号，若是个人输入身份证号"></td>
		</tr>
		<tr>
			<td class="layui-td-gray">开户行</td>
			<td><input type="text" name="invoice_bank" class="layui-input" value=""></td>
			<td class="layui-td-gray">银行账号</td>
			<td><input type="text" name="invoice_account" class="layui-input" value=""></td>
		</tr>
		<tr>
			<td class="layui-td-gray">电话号码</td>
			<td><input type="text" name="invoice_phone" class="layui-input" value=""></td>
			<td class="layui-td-gray">详细地址</td>
			<td><input type="text" name="invoice_address" class="layui-input" value=""></td>
		</tr>
		<tr>
			<td colspan="4"><strong>发票信息</strong></td>
		</tr>
		<tr>
			<td class="layui-td-gray-2">开票金额<font>*</font></td>
			<td><input type="text" class="layui-input" name="amount" lay-verify="required|number" placeholder="请输入开票金额" lay-reqText="请输入开票金额" value=""></td>
			<td class="layui-td-gray">开票类型<font>*</font></td>
			<td>
				<select name="invoice_type" lay-verify="required" lay-reqText="请选择开票类型">
				<option value="">请选择开票类型</option>
				<option value="1">增值税专用发票</option>
				<option value="2">增值税普通发票</option>
				<option value="3">其他专业发票</option>
			  </select>
			</td>
		</tr>
		<tr>
			<td class="layui-td-gray">关联销售合同</td>
			<td>
				<input type="text" class="layui-input picker-oa" data-types="contract" data-field="name" name="contract_name" placeholder="请选择需要关联的销售合同" readonly value="">		
				<input type="hidden" class="layui-input" name="contract_id" value="0">		
			</td>
			<td class="layui-td-gray">关联项目</td>
			<td>
				<input type="text" class="layui-input picker-oa" data-types="project" name="project_name" placeholder="请选择需要关联的项目" readonly value="">		
				<input type="hidden" class="layui-input" name="project_id" value="0">		
			</td>
		</tr>
		<tr>
			<td class="layui-td-gray">发票内容</td>
			<td colspan="3"><textarea name="remark" placeholder="请输入发票内容" class="layui-textarea"></textarea></td>
		</tr>
		<tr>
			<td class="layui-td-gray">
				<div class="layui-input-inline">相关附件</div>
				<div class="layui-input-inline">
					<button type="button" class="layui-btn layui-btn-xs" id="uploadBtn"><i class="layui-icon"></i></button>
				</div>
			</td>
			<td colspan="3" style="padding:4px 2px;">
				<div class="layui-row" id="uploadBox">
					<input type="hidden" data-type="file" name="file_ids" value="">
				</div>
			</td>
		</tr>
	</table>
	<div id="checkBox" data-status="0" data-id="0" data-checkflowid="0" class="pt-3"></div>
	<div class="pt-4">
		<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">立即提交</button>
		<button type="reset" class="layui-btn layui-btn-primary">重置</button>
	</div>
</form>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	var moduleInit = ['tool','oaPicker','oaCheck','uploadPlus'];
	function gouguInit() {
		var form = layui.form, tool = layui.tool, oaPicker = layui.oaPicker,oaCheck = layui.oaCheck,uploadPlus = layui.uploadPlus;
		//选择抬头类型
		form.on('radio(type)', function (data) {
			if(data.value==2){
				$('.invoice-qiye').hide();
			}
			else{
				$('.invoice-qiye').show();
			}
			$('[name="invoice_title"]').val('');
			$('[name="customer_id"]').val('');
			$('[name="invoice_tax"]').val('');
			$('[name="invoice_bank"]').val('');
			$('[name="invoice_account"]').val('');
			$('[name="invoice_phone"]').val('');
			$('[name="invoice_address"]').val('');
		});
		
		//相关附件上传
		var attachment = new uploadPlus();
		
		//审批相关
		oaCheck.init({
			check_name:'invoice',
			check_btn:0
		});
		
		$('.subject-picker').on('click',function(){
			let that = $(this),ids = [],titles=[],tax_num=[];
			let callback = function(data){
				for ( var i = 0; i <data.length; i++){
					ids.push(data[i].id);
					titles.push(data[i].title);
					tax_num.push(data[i].tax_num);
				}
				$('[name="subject_name"]').val(titles.join(','));
				$('[name="invoice_subject"]').val(ids.join(','));
				$('.subject_tax_num').html(tax_num.join(','));
			}
			oaPicker.picker('enterprise',1,callback,{});
		});
		
		$('.customer-picker').on('click',function(){
			let that = $(this),ids = [],titles=[],tax_num=[],tax_bank=[],tax_banksn=[],tax_mobile=[],tax_address=[];
			let callback = function(data){
				for ( var i = 0; i <data.length; i++){
					ids.push(data[i].id);
					titles.push(data[i].name);
					tax_num.push(data[i].tax_num);
					tax_bank.push(data[i].tax_bank);
					tax_banksn.push(data[i].tax_banksn);
					tax_mobile.push(data[i].tax_mobile);
					tax_address.push(data[i].tax_address);
				}
				$('[name="invoice_title"]').val(titles.join(','));
				$('[name="customer_id"]').val(ids.join(','));
				$('[name="invoice_tax"]').val(tax_num.join(','));
				$('[name="invoice_bank"]').val(tax_bank.join(','));
				$('[name="invoice_account"]').val(tax_banksn.join(','));
				$('[name="invoice_phone"]').val(tax_mobile.join(','));
				$('[name="invoice_address"]').val(tax_address.join(','));
			}
			oaPicker.picker('customer',1,callback,{});
		});
		//监听提交
		form.on('submit(webform)', function (data) {
			let callback = function (e) {
				layer.msg(e.msg);
				if (e.code == 0) {
					let checkCallback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							tool.sideClose(1000);				
						}
					}
					data.field.check_name = 'invoice';
					data.field.action_id = e.data.return_id;
					oaCheck.submit(data.field,checkCallback);
				}
			}
			let clickbtn = $(this);
			tool.post("/finance/invoice/add", data.field, callback,clickbtn);
			return false;
		});
	}
</script>
{/block}
<!-- /脚本 -->
