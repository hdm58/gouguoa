<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>H5的iframe定位打卡</title>
<style>
  body{width: 100%; height: 100%;font-size: 14px; margin:0; padding:0; background-color:#f5f5f5}
  #container{width: 100vw; height: 50vh; margin:0; padding:0;}
  .tmap-zoom-control{margin:6px!important;}
  .location{position: absolute; right: 6px; top: 90px;z-index: 9999; width:36px; padding:4px 2px; text-align:center; background-color:#00A7FF; color:#ffffff; border-radius: 4px;font-size: 12px;}
  
  .location-info {background: #ffffff; padding:6px 12px; margin:-60px 12px 0; position:relative; z-index: 9999; border-radius:8px;}        
  .info-row {display: flex;justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e9ecef;}        
  .info-row:last-child {border-bottom: none; margin-bottom: 0;}
  .info-label{color: #495057; font-size: 14px;}
  .info-value{color: #212529; font-size: 14px; text-align: right; flex: 1; margin-left: 10px;}
	  
  .upload-section {padding:15px 12px;}        
  .upload-area{background-color:#ffffff; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; margin-bottom: 10px;}
  .upload-icon {font-size: 32px;color: #6c757d;margin-bottom: 10px;}
  .upload-text {color: #6c757d; font-size: 14px; margin-bottom: 5px;}
  .upload-hint {color: #adb5bd; font-size: 12px;}
  #imagePreview {max-width: 100%; max-height: 150px; border-radius: 6px; margin-top: 10px; display: none; }
  .checkin-section {text-align: center; margin: 12px;}
   .checkin-btn {width: 100%;padding: 12px;background: linear-gradient(45deg, #28a745, #20c997); color: #ffffff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s ease;}
   .checkin-btn.checking {background: #ffc107; color: #212529; }
    </style>
    <script src="https://map.qq.com/api/gljs?v=1.exp&key={$key}"></script>
    <script src="/static/jquery.min.js"></script>
  </head>
  <body>
    <div id="container"></div>
    <div class="location"onClick="getLocation()">重新<br>定位</div>
	<div class="location-info">
		<div class="info-row">
			<span class="info-label">📍 位置</span>
			<span class="info-value" id="locationStatus">定位中...</span>
		</div>
		<div class="info-row">
			<span class="info-label">📌 坐标</span>
			<span class="info-value" id="latitude">--</span><span class="info-value" id="longitude">--</span>
		</div>
		<div class="info-row">
			<span class="info-label">🏢 地址</span>
			<span class="info-value" id="address">获取地址中...</span>
		</div>
	</div>
	
	<div class="upload-section">
		<div class="upload-area" id="uploadArea">
			<div class="upload-icon">📸</div>
			<div class="upload-text">点击上传打卡图片</div>
			<div class="upload-hint">支持 JPG、PNG 格式，建议展示工作环境</div>
		</div>
		<input type="file" id="imageInput" accept="image/*" style="display: none;">
		<img id="imagePreview" alt="预览图片">
	</div>
	
	<div class="checkin-section">
		<button class="checkin-btn" id="checkinBtn" disabled>
			🎯 立即打卡
		</button>
		<div id="messageArea"></div>
	</div>

    <script>
		let targetMarker = null;
		let targetLatitude = 23.1313;  // 目标打卡点纬度
		let targetLongitude = 113.001566; // 目标打卡点经度
		const map = new TMap.Map("container", {
			center: new TMap.LatLng(targetLatitude, targetLongitude),
			zoom: 16 
		});
		//工具组件
		map.removeControl(TMap.constants.DEFAULT_CONTROL_ID.ROTATION);
	  
		// 添加目标位置标记（打卡点）
		targetMarker = new TMap.MultiMarker({
			map: map,
			styles: {
				target: new TMap.MarkerStyle({
					width: 32,
					height: 32,
					anchor: { x: 16, y: 30 },
					src: '/static/home/images/map1.png'
				})
			},
			geometries: [{
				id: 'target',
				styleId: 'target',
				position: new TMap.LatLng(targetLatitude, targetLongitude),
				properties: {
					title: '打卡位置'
				}
			}]
		}); 
	  
	  
      //地图marker图层
      const markerLayer = new window.TMap.MultiMarker({ id: 'markers', map,
			styles: {
				current: new TMap.MarkerStyle({
					width: 32,
					height: 32,
					anchor: { x: 16, y: 16 },
					src: '/static/home/images/map2.png'
				})
			}});
      const key = '{$key}';
      ///项目标识
      const referer = 'geolocation';
      ///立即触发标识
      const immediate = 1;

      const iframeDOM = document.createElement('iframe');
      iframeDOM.width = 0;
      iframeDOM.height = 0;
      iframeDOM.src = 'https://mapapi.qq.com/web/lbs/h5-components/geolocation/geolocation.html?key='+key+'&referer='+referer+'&immediate='+immediate+'&v='+Date.now();
      iframeDOM.allow = 'geolocation *';

      //定位成功展示结果
      const onSuccess = (result) => {
			console.log('>>> 定位成功回调数据', result);
			const { lat, lng } = result;
			const origin = new window.TMap.LatLng(lat, lng);
			markerLayer.setGeometries([{ id: 1,styleId: 'current', position: origin }]);
			map.easeTo({ center: origin, zoom: 16 });
			$('#latitude').text(result.lat);
            $('#longitude').text(result.lng);
            $('#address').text(result.city+result.addr);
			let distance = getDistance(result.lat, result.lng, targetLatitude, targetLongitude);
			$('#locationStatus').text('定位成功，距离打卡点：'+distance.toFixed(2)+'米');
      };
      //定位失败回调
      const onError = (error) => {
		  console.log('>>> 定位失败回调数据', error);
		  $('#latitude').text('-');
          $('#longitude').text('-');
          $('#address').text('定位失败');
          $('#locationStatus').text('定位失败，请开启定位或网络后重新定位');
	  }

      window.addEventListener('message', ({ data }) => {
        if (data?.source !== 'lbs-geolocation' && !data?.func) {
			return;
        }
        switch (data.func) {
          // 返回的是getLocation方法的结果
          case 'getLocation':
          // 返回的是getIpLocation的结果
          case 'watchPosition': {
            const { result } = data;
            result?.module ? onSuccess(result) : onError(result);
            break;
          }
          // 未知类型可以打印查看
          default: {
            console.log('data.func', data.func);
            break;
          }
        }
      });
      document.body.appendChild(iframeDOM);
	  //与iframeDOM通信函数
      const onPost = (payload) => iframeDOM.contentWindow.postMessage(payload, '*');
      const getLocation = () => {
			$('#locationStatus').text('定位中...');
			onPost({ func: 'getLocation', options: { timeout: 5000, highAccuracy: true } });
	  }
	// Haversine公式计算距离
	function getDistance(lat1, lon1, lat2, lon2) {
		const R = 6371000; // 地球半径（米）
		const dLat = deg2rad(lat2 - lat1);
		const dLon = deg2rad(lon2 - lon1);
		const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
			Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
			Math.sin(dLon/2) * Math.sin(dLon/2);
		const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
		return R * c;
	}
	function deg2rad(deg) {
		return deg * (Math.PI/180);
	}
    </script>
  </body>
</html>
