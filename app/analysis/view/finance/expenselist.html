{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}

<div class="p-page">
	<div class="layui-row layui-col-space12">
		<div class="layui-col-md12">	
		<form id="analysisForm" class="layui-form border bg-white p-3">
			<div class="layui-input-inline" style="width:100px;">
				<input type="text" class="layui-input tool-time" data-type="year" placeholder="选择年度" readonly name="year" value="2026">
				<input type="hidden" name="types" value="0">
			</div>
			<div class="layui-input-inline" style="width: 150px;">
				<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">提交查询</button>
				<button type="reset" class="layui-btn layui-btn-reset" lay-filter="reset">重置</button>
			</div>
		</form>			
		</div>
	</div>
	<div class="layui-row layui-col-space12">
		<div class="layui-col-md12">
			<div class="layui-row">
				<div class="layui-col-md8">
					<div class="layui-card">
						<div id="barA" class="chart-box" style="width: 100%; height:480px" data-type="bar" data-types="1" data-url="/analysis/finance/expenselist"></div>
					</div>
				</div>
				<div class="layui-col-md4">
					<div class="layui-card">
						<div id="pieA" class="chart-box" style="width: 100%; height:480px" data-type="pie" data-types="2" data-url="/analysis/finance/expenselist"></div>
					</div>
				</div>
			</div>
		</div>
		<div class="layui-col-md12">
			<div class="layui-card">
				<div class="layui-card-body">
					<div id="barB" class="chart-box" style="height: 1000px;" data-type="barVertical" data-types="3" data-url="/analysis/finance/expenselist"></div>
				</div>
			</div>
		</div>
	</div>
</div>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script src="/static/assets/third_party/echart/echarts.min.js"></script>
<script>
	const moduleInit = ['tool','laydatePlus'];
	const charts = [];
    var chartsData={
		"title": {
			"text": "报销数据分析"
		},
		"legend": [],
		"xaxis": [],
		"series": []
	};
 	
	//加载有数据
    function initBoxData() {
		var index = layer.load(0, {shade: false});
		setTimeout(function(){
			layer.close(index);
		}, 1000);
        $('.chart-box').each(function(){
            var id  =$(this).attr("id");
            ajaxCharts(id);
        });
    }
	
    function ajaxCharts(id) {
        var that=$('#'+id+'');
        var type=that.data('type');
        var types=that.data('types');
        var target=that.attr('data-url');
		$('[name="types"]').val(types);
        var searchData=$('#analysisForm').serialize();
        $.ajax({
            type: "POST",
            url: target,
            data: searchData,
            dataType: "json",
            async: false,
            success: function (e) {
				if(e.code==0){
					chartsData=e.data;
				}
            },
            complete: function () {

            }
        });
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById(id));
        switch (type) {
            case 'bar':
                option = {
                    title: {
                        text: chartsData.title.text,
						left: '12px',
						top:'12px'
                    },
					grid: {
						top: '60px',
						left: '20px',
						right: '20px',
						bottom: '12px',
						containLabel: true
					},
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'cross',
                            crossStyle: {
                                color: '#999'
                            }
                        }
                    },
                    legend: {
                        data: chartsData.legend
                    },
                    xAxis: [
                        {
                            type: 'category',
                            data: chartsData.xaxis,
                            axisTick: {
								alignWithLabel: true
							}
                        }
                    ],
                    yAxis:chartsData.yaxis,
                    series:chartsData.series
                };
				myChart.setOption(option);
				charts.push(myChart);
            break;
			case 'pie':
				option = {
					title: {
						text: chartsData.title.text,
						left: '10px',
						top:'12px'
					},
					tooltip: {
						trigger: 'item'
					},
					legend: {
						orient: 'vertical',
						top: '36px',
					    right: '12px',
					},
					series: [
						{
							// name: 'Access From',
							type: 'pie',
							radius: '50%',
							data:chartsData.series.data,
							emphasis: {
								itemStyle: {
									shadowBlur: 10,
									shadowOffsetX: 0,
									shadowColor: 'rgba(0, 0, 0, 0.5)'
								}
							}
						}
					]
				};
				myChart.setOption(option);
				charts.push(myChart);
			break;
			case "barVertical":
				option = {
					title: {
						text: chartsData.title.text
					},
					tooltip: {
						trigger: 'axis',
						axisPointer: {
							type: 'shadow'
						}
					},
					legend: {},
					grid: {
						left: '3%',
						right: '4%',
						bottom: '3%',
						containLabel: true
					},
					xAxis: {
						type: 'value',
						boundaryGap: [0, 0.01]
					},
					yAxis: {
						type: 'category',
						data: chartsData.yAxis
					},
					series:chartsData.series
				};
				// 使用刚指定的配置项和数据显示图表。
				myChart.setOption(option);
				charts.push(myChart);
			break;
        }
    }
	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool,form  = layui.form, laydatePlus = layui.laydatePlus;
		var diff_time = new laydatePlus({'target':'diff_time'});
		initBoxData();
		//监听提交
		form.on('submit(webform)', function (data) {
			initBoxData();
			return false;
		});
		$(window).on('resize', function () {
			charts.forEach(function (c) {
				c.resize(); 
			})
		});
	}
</script>
{/block}
<!-- /脚本 -->
